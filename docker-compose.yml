volumes:
  postgres_data:
    name: resultportal_postgres_data
  staticfiles:
    name: resultportal_staticfiles
  mediafiles:
    name: resultportal_mediafiles

networks:
  resultportal_network:
    name: resultportal_network
    driver: bridge
