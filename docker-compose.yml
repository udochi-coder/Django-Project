

services:
  db:
    image: postgres:16-alpine
    container_name: resultportal_db
    environment:
      POSTGRES_DB: ${DB_NAME:-result-portal-db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resultportal_network

  web:
    build: .
    container_name: resultportal_web
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        python manage.py migrate --noinput &&
        echo 'Running migrations...' &&
        python manage.py collectstatic --noinput &&
        echo 'Collecting static files...' &&
        gunicorn ResultPortal.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
      "
    networks:
      - resultportal_network

